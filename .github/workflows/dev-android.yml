name: Dev Android

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-android-release
  cancel-in-progress: false
  queue: max

jobs:
  android:
    if: github.repository == 'uZIDADADA/pt_mate' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Signing and version
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.PT_MATE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PT_MATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PT_MATE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('android/key.properties').write_text(
              'storeFile=keystore.jks\nkeyAlias=' + escape(os.environ['KEY_ALIAS']) +
              '\nstorePassword=' + escape(os.environ['KEYSTORE_PASSWORD']) +
              '\nkeyPassword=' + escape(os.environ['KEYSTORE_PASSWORD']) + '\n')
          PY
          build=$((200000 + GITHUB_RUN_NUMBER))
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)-dev.$GITHUB_RUN_NUMBER"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=dev-$build" >> "$GITHUB_OUTPUT"
      - name: Build signed APK
        env:
          BUILD: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: flutter build apk --release --target-platform android-arm64 --build-number "$BUILD" --build-name "$VERSION" --dart-define=ENABLE_SECURE_STORAGE_TRANSACTIONS=false
      - name: Verify APK and generate update manifest
        env:
          BUILD: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pt-mate-dev.apk
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort | tail -1)
          test "$($APKANALYZER manifest application-id dist/pt-mate-dev.apk)" = 'com.github.uzidadada.ptmate'
          test "$($APKANALYZER manifest version-code dist/pt-mate-dev.apk)" = "$BUILD"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify dist/pt-mate-dev.apk
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('dist/pt-mate-dev.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {'repository': 'uZIDADADA/pt_mate', 'channel': 'dev',
              'applicationId': 'com.github.uzidadada.ptmate',
              'version': os.environ['VERSION'], 'buildNumber': int(os.environ['BUILD']),
              'apkUrl': f"https://github.com/uZIDADADA/pt_mate/releases/download/dev-{os.environ['BUILD']}/pt-mate-dev.apk",
              'sha256': digest, 'size': apk.stat().st_size, 'commit': os.environ['GITHUB_SHA']}
          Path('dist/update.json').write_text(json.dumps(manifest, indent=2) + '\n')
          Path('dist/SHA256SUMS').write_text(digest + '  pt-mate-dev.apk\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: android-dev-${{ steps.version.outputs.build }}
          path: dist/
      - name: Publish version and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '自动构建自 dev 分支提交：%s\n\n独立应用 PT Mate Dev；同签名覆盖升级会保留已有配置。\n' "$GITHUB_SHA" > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This build has already been published. Immutable release kept.'
            gh release download "$TAG" --pattern update.json --dir dist --clobber
          else
            gh release create "$TAG" dist/pt-mate-dev.apk dist/update.json dist/SHA256SUMS --target "$GITHUB_SHA" --title "PT Mate Dev $VERSION" --notes-file /tmp/release-notes.md --prerelease
          fi
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --target "$GITHUB_SHA" --title 'PT Mate Dev 更新通道' --notes '安装版本化 dev 发布中的 APK。应用仅从本仓库读取更新信息。' --prerelease
          fi
          # A late rerun of an older build must never roll the channel back.
          if gh release download dev-latest --pattern update.json --dir /tmp/current-channel; then
            if python3 -c "import json; import sys; sys.exit(0 if json.load(open('/tmp/current-channel/update.json'))['buildNumber'] >= json.load(open('dist/update.json'))['buildNumber'] else 1)"; then
              exit 0
            fi
          fi
          gh release upload dev-latest dist/update.json --clobber
      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties
